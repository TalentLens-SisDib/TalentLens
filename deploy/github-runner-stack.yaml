services:
  github-runner:
    image: ghcr.io/myoung34/docker-github-actions-runner:ubuntu-noble
    restart: unless-stopped
    environment:
      RUNNER_SCOPE: org
      ORG_NAME: TalentLens-SisDib
      ACCESS_TOKEN: ${GITHUB_RUNNER_TOKEN:?Set GITHUB_RUNNER_TOKEN in the runner stack}
      RUNNER_NAME_PREFIX: talentlens-portainer
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: talentlens
      EPHEMERAL: "true"
