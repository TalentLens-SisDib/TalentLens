name: Redeploy Portainer stack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  redeploy:
    runs-on: [self-hosted, talentlens]
    steps:
      - name: Pull latest stack and images
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_CONNECT_IP: ${{ secrets.PORTAINER_CONNECT_IP }}
          PORTAINER_CA_CERT: ${{ secrets.PORTAINER_CA_CERT }}
        run: |
          set -eu
          : "${PORTAINER_URL:?Configure the PORTAINER_URL secret}"
          : "${PORTAINER_API_KEY:?Configure the PORTAINER_API_KEY secret}"
          : "${PORTAINER_STACK_ID:?Configure the PORTAINER_STACK_ID secret}"
          : "${PORTAINER_ENDPOINT_ID:?Configure the PORTAINER_ENDPOINT_ID secret}"
          : "${PORTAINER_CONNECT_IP:?Configure the PORTAINER_CONNECT_IP secret}"
          curl_args=(--fail --silent --show-error --retry 3)
          curl_args+=(--connect-to "localhost:9443:${PORTAINER_CONNECT_IP}:9443" --noproxy '*')
          if [ -n "${PORTAINER_CA_CERT:-}" ]; then
            printf '%s\n' "$PORTAINER_CA_CERT" > "$RUNNER_TEMP/portainer-ca.pem"
            curl_args+=(--cacert "$RUNNER_TEMP/portainer-ca.pem")
          fi
          curl "${curl_args[@]}" \
            --request PUT \
            --header "X-API-Key: $PORTAINER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"RepullImageAndRedeploy":true}' \
            "${PORTAINER_URL%/}/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$PORTAINER_ENDPOINT_ID"
