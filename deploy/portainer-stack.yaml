services:
  api:
    image: ghcr.io/talentlens-sisdib/api:main
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/talentlens.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the Portainer stack}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-openrouter/free}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://openrouter.ai/api/v1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    volumes:
      - api_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/talentlens-sisdib/app:main
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the Portainer stack}
    depends_on:
      web:
        condition: service_healthy

volumes:
  api_data:
